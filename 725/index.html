<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Journey Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-wrapper">
        <header class="header-banner">
            <h1>Genshin Journey Tracker</h1>
            <button type="button" id="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>
        </header>

        <!-- ACCOUNT -->
        <section class="panel">
            <h2>Account</h2>
            <div class="grid-3col">
                <label>AR <input type="number" id="ar" value="31"></label>
                <label>WL <input type="number" id="wl" value="3"></label>
                <label>Server <input type="text" id="server" value="Asia"></label>
                <label>Birthday <input type="text" id="birthday" value="-"></label>
                <label>Current Region <input type="text" id="current-region" value="Nod Krai"></label>
            </div>
            <div class="grid-1col" style="margin-top: 8px;">
                <label>Archon Quest <input type="text" id="archon-quest" value="Chapter I Act IV"></label>
                <label>Story Quest <input type="text" id="story-quest" value="-"></label>
                <label>Active World Quest Count <input type="number" id="world-quest-count" value="3"></label>
                <label>Important World Quests <textarea id="world-quest-important" rows="2" placeholder="Aranyaka, Golden Slumber, Sacred Sakura Cleverness"></textarea></label>
            </div>
        </section>

        <!-- WISH SYSTEM -->
        <section class="panel">
            <h2>Wish & Pity History</h2>
            <div class="grid-2col">
                <label>Char Banner Pity <input type="number" id="pity-char" value="0"></label>
                <label>Char Banner Guaranteed <select id="guaranteed-char"><option value="No">No</option><option value="Yes">Yes</option></select></label>
                <label>Last 5★ Char Banner <input type="text" id="last-5star-char" placeholder="e.g. Jean"></label>
                <label>Standard Banner Pity <input type="number" id="pity-standard" value="0"></label>
                <label class="grid-span-2">Last 5★ Standard Banner <input type="text" id="last-5star-standard" placeholder="e.g. Amos Bow"></label>
            </div>
        </section>

        <!-- RESOURCES & BILLETS -->
        <section class="panel">
            <h2>Resources</h2>
            <div class="grid-3col">
                <label>Primogem <input type="number" id="primo" value="4699"></label>
                <label>Genesis Crystal <input type="number" id="genesis" value="0"></label>
                <label>Intertwined Fate <input type="number" id="intertwined" value="8"></label>
                <label>Acquaint Fate <input type="number" id="acquaint" value="1"></label>
                <label>Original Resin <input type="number" id="resin" value="99"></label>
                <label>Fragile Resin <input type="number" id="fragile" value="22"></label>
                <label>Mora <input type="number" id="mora" value="841556"></label>
                <label>Hero's Wit <input type="number" id="herowit" value="37"></label>
                <label>Mystic Ore <input type="number" id="mystic-ore" value="100"></label>
                <label>Dream Solvent <input type="number" id="dream-solvent" value="0"></label>
                <label>Crown <input type="number" id="crown" value="0"></label>
            </div>

            <h3 style="margin-top: 12px;">Crafting Billets</h3>
            <div class="grid-2col">
                <label>Sword Billet (North / Mid) <input type="text" id="billet-sword" value="0 / 0"></label>
                <label>Claymore Billet (North / Mid) <input type="text" id="billet-claymore" value="0 / 0"></label>
                <label>Polearm Billet (North / Mid) <input type="text" id="billet-polearm" value="0 / 0"></label>
                <label>Bow Billet (North / Mid) <input type="text" id="billet-bow" value="0 / 0"></label>
                <label class="grid-span-2">Catalyst Billet (North / Mid) <input type="text" id="billet-catalyst" value="0 / 0"></label>
            </div>
        </section>

        <!-- CURRENT PARTY BUILD -->
        <section class="panel">
            <h2>Current Party (Detailed Build)</h2>
            <div class="grid-4col" style="margin-bottom: 12px;">
                <input type="text" id="team1" list="char-suggestions" placeholder="Slot 1" value="Traveler">
                <input type="text" id="team2" list="char-suggestions" placeholder="Slot 2" value="Xiangling">
                <input type="text" id="team3" list="char-suggestions" placeholder="Slot 3" value="Kaeya">
                <input type="text" id="team4" list="char-suggestions" placeholder="Slot 4" value="Barbara">
            </div>

            <div class="add-char-block">
                <div class="grid-3col">
                    <label>Name <input type="text" id="cp-name" list="char-suggestions" placeholder="Name"></label>
                    <label>Level <input type="number" id="cp-level" value="60"></label>
                    <label>Constellation <input type="text" id="cp-const" value="C0"></label>
                    <label>Friendship <input type="number" id="cp-friend" value="1"></label>
                    <label>Weapon <input type="text" id="cp-weapon" placeholder="Slingshot R4 Lv60"></label>
                    <label>Artifact <input type="text" id="cp-artifact" value="Temporary"></label>
                </div>
                <div class="grid-3col" style="margin-top: 8px;">
                    <label>Normal Attack <input type="number" id="cp-t-norm" value="1"></label>
                    <label>Skill <input type="number" id="cp-t-skill" value="1"></label>
                    <label>Burst <input type="number" id="cp-t-burst" value="1"></label>
                </div>
                <button type="button" class="btn-accent" style="margin-top: 8px; width: 100%;" onclick="addPartyDetail()">Update Active Party Build</button>
            </div>
            <div id="party-build-list" class="roster-list-container"></div>
        </section>

        <!-- FULL ROSTER -->
        <section class="panel">
            <h2>Full Roster (Simple Ownership List)</h2>
            <div class="add-char-block">
                <div class="grid-3col">
                    <label>Character Name
                        <input type="text" id="c-name" list="char-suggestions" placeholder="Select/Type Name">
                    </label>
                    <label>Level <input type="number" id="c-level" value="50"></label>
                    <label>Constellation <input type="text" id="c-const" value="C0"></label>
                </div>
                <button type="button" class="btn-accent" style="margin-top: 8px; width: 100%;" onclick="addCharacter()">+ Add to Roster</button>
            </div>

            <!-- Datalist Autocomplete -->
            <datalist id="char-suggestions">
                <option value="Traveler"><option value="Amber"><option value="Kaeya"><option value="Lisa">
                <option value="Barbara"><option value="Xiangling"><option value="Noelle"><option value="Fischl">
                <option value="Razor"><option value="Bennett"><option value="Sucrose"><option value="Xingqiu">
                <option value="Beidou"><option value="Ningguang"><option value="Chongyun"><option value="Diluc">
                <option value="Jean"><option value="Mona"><option value="Keqing"><option value="Qiqi">
                <option value="Venti"><option value="Klee"><option value="Tartaglia"><option value="Zhongli">
                <option value="Albedo"><option value="Ganyu"><option value="Xiao"><option value="Hu Tao">
                <option value="Eula"><option value="Kazuha"><option value="Ayaka"><option value="Yoimiya">
                <option value="Raiden Shogun"><option value="Kokomi"><option value="Itto"><option value="Yelan">
                <option value="Tighnari"><option value="Collei"><option value="Dori"><option value="Cyno">
                <option value="Nilou"><option value="Nahida"><option value="Wanderer"><option value="Alhaitham">
                <option value="Baizhu"><option value="Lyney"><option value="Neuvillette"><option value="Wriothesley">
                <option value="Furina"><option value="Navia"><option value="Xianyun"><option value="Arlecchino">
                <option value="Clorinde"><option value="Emilie"><option value="Mualani"><option value="Kinich">
                <option value="Xilonen"><option value="Chasca"><option value="Mavuika">
            </datalist>

            <div id="roster-list" class="roster-list-container"></div>
        </section>

        <!-- WEAPONS -->
        <section class="panel">
            <h2>Weapons Inventory</h2>
            <div class="grid-1col">
                <label>5★ Weapons <textarea id="wpn-5star" rows="2" placeholder="None"></textarea></label>
                <label>4★ Weapons <textarea id="wpn-4star" rows="3" placeholder="Favonius Sword R2 Lv50&#10;Favonius Warbow R1 Lv50"></textarea></label>
                <label>3★ Weapons <textarea id="wpn-3star" rows="3" placeholder="Slingshot R4&#10;TTDS R4"></textarea></label>
            </div>
        </section>

        <!-- EXPLORATION & PROGRESSION -->
        <section class="panel">
            <h2>Exploration</h2>
            <div class="grid-3col">
                <label>Mondstadt <input type="text" id="exp-mondstadt" value="38%"></label>
                <label>Liyue <input type="text" id="exp-liyue" value="10%"></label>
                <label>Dragonspine <input type="text" id="exp-dragonspine" value="0%"></label>
                <label>Inazuma <input type="text" id="exp-inazuma" value="0%"></label>
                <label>Enkanomiya <input type="text" id="exp-enkanomiya" value="0%"></label>
                <label>Chasm (Underground) <input type="text" id="exp-chasm" value="0%"></label>
                <label>Sumeru <input type="text" id="exp-sumeru" value="0%"></label>
                <label>Fontaine <input type="text" id="exp-fontaine" value="0%"></label>
                <label>Chenyu Vale <input type="text" id="exp-chenyu" value="0%"></label>
                <label>Remuria <input type="text" id="exp-remuria" value="0%"></label>
                <label>Natlan <input type="text" id="exp-natlan" value="0%"></label>
                <label>Nod Krai <input type="text" id="exp-nodkrai" value="0%"></label>
            </div>

            <h2 style="margin-top: 15px;">Statues & Progression</h2>
            <div class="grid-3col">
                <label>Spiral Abyss <input type="text" id="abyss" value="Floor 3 Chamber 3"></label>
                <label>Statue Mondstadt <input type="text" id="statue-mond" value="7/7"></label>
                <label>Statue Liyue <input type="text" id="statue-liyue" value="5/5"></label>
                <label>Statue Inazuma <input type="text" id="statue-inazuma" value="0/10"></label>
                <label>Statue Sumeru <input type="text" id="statue-sumeru" value="1/7"></label>
                <label>Statue Fontaine <input type="text" id="statue-fontaine" value="0/10"></label>
                <label>Statue Natlan <input type="text" id="statue-natlan" value="0/10"></label>
            </div>
        </section>

        <!-- WEEKLY -->
        <section class="panel">
            <h2>Weekly Bosses</h2>
            <div class="checklist-grid">
                <label><input type="checkbox" id="wb-dvalin"> Stormterror (Dvalin)</label>
                <label><input type="checkbox" id="wb-andrius"> Wolf (Andrius)</label>
                <label><input type="checkbox" id="wb-childe"> Childe (Golden House)</label>
                <label><input type="checkbox" id="wb-azhdaha"> Azhdaha</label>
                <label><input type="checkbox" id="wb-signora"> La Signora</label>
                <label><input type="checkbox" id="wb-raiden"> Magatsu Mitake Narukami</label>
                <label><input type="checkbox" id="wb-scara"> Shouki no Kami (Scaramouche)</label>
                <label><input type="checkbox" id="wb-apep"> Guardian of Apep's Oasis</label>
                <label><input type="checkbox" id="wb-whale"> All-Devouring Narwhal</label>
                <label><input type="checkbox" id="wb-knave"> The Knave (Arlecchino)</label>
                <label><input type="checkbox" id="wb-natlan"> Natlan Weekly Boss</label>
            </div>

            <h3 style="margin-top: 12px;">Reputation Level</h3>
            <div class="grid-3col">
                <label>Mondstadt <input type="number" id="rep-mondstadt" value="3"></label>
                <label>Liyue <input type="number" id="rep-liyue" value="2"></label>
                <label>Inazuma <input type="number" id="rep-inazuma" value="0"></label>
                <label>Sumeru <input type="number" id="rep-sumeru" value="0"></label>
                <label>Fontaine <input type="number" id="rep-fontaine" value="0"></label>
                <label>Natlan <input type="number" id="rep-natlan" value="0"></label>
            </div>
        </section>

        <!-- GOALS -->
        <section class="panel">
            <h2>Goals</h2>
            <div class="grid-1col">
                <label>Current Goal <input type="text" id="goal-current" value="Finish Liyue"></label>
                <label>Medium Goal <input type="text" id="goal-medium" value="Unlock Inazuma"></label>
                <label>Long Goal (Targets) <textarea id="goal-long" rows="2" placeholder="Nahida, Zhongli"></textarea></label>
            </div>
        </section>

        <!-- OUTPUT AREA -->
        <section class="panel" id="output-section" style="display:none;">
            <h2>Generated Output</h2>
            <textarea id="text-output" readonly></textarea>
        </section>

        <!-- BUTTONS -->
        <footer class="action-footer">
            <div class="btn-group">
                <button type="button" onclick="logSession()">Save</button>
                <button type="button" class="btn-accent" onclick="generateReport()">Generate Report</button>
                <button type="button" onclick="compareSessions()">Compare</button>
                <button type="button" onclick="exportJSON()">Export JSON</button>
                <button type="button" onclick="document.getElementById('importFile').click()">Import JSON</button>
                <button type="button" onclick="copyReport()">Copy Report</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
