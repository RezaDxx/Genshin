<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Endgame Tactical Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-wrapper">
        <header class="header-banner">
            <div class="brand">
                <span class="badge-tag">ENDGAME HUD</span>
                <h1>TEYVAT PROGRESS TRACKER</h1>
            </div>
            <button type="button" id="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>
        </header>

        <!-- DASHBOARD OVERVIEW -->
        <section class="panel highlight-panel">
            <h2>Current Endgame Priority</h2>
            <div class="grid-2col">
                <label>Main Focus <input type="text" id="p-main" value="Farm Crimson Witch for Arlecchino"></label>
                <label>Today's Resin Plan <input type="text" id="p-resin" value="Talent Books: Order (Wednesday/Saturday)"></label>
                <label>Weekly Boss Targets <input type="text" id="p-weekly" value="Arlecchino (3/3 Left), Narwhal"></label>
                <label>Next Banner Target <input type="text" id="p-target" value="Mavuika (Pyro Archon) + Signature WE"></label>
            </div>
        </section>

        <!-- ACCOUNT STATUS -->
        <section class="panel">
            <h2>Account Status</h2>
            <div class="grid-4col">
                <label>AR Level <input type="number" id="acc-ar" value="58"></label>
                <label>World Level <input type="number" id="acc-wl" value="8"></label>
                <label>Server <input type="text" id="acc-server" value="Asia"></label>
                <label>Teapot Lv <input type="number" id="acc-teapot" value="10"></label>
            </div>
        </section>

        <!-- RESOURCES & RESIN MANAGEMENT -->
        <section class="panel">
            <h2>Resources & Resin Inventory</h2>
            <div class="grid-3col">
                <label>Primogems <input type="number" id="res-primo" value="14200"></label>
                <label>Intertwined Fates <input type="number" id="res-fates-event" value="18"></label>
                <label>Acquaint Fates <input type="number" id="res-fates-standard" value="4"></label>
                <label>Current Resin <input type="number" id="res-resin" value="160"></label>
                <label>Fragile Resin <input type="number" id="res-fragile" value="24"></label>
                <label>Transient Resin <input type="number" id="res-transient" value="1"></label>
                <label>Mora <input type="number" id="res-mora" value="8500000"></label>
                <label>Hero's Wit <input type="number" id="res-wit" value="420"></label>
                <label>Crown of Insight <input type="number" id="res-crown" value="5"></label>
                <label>Crowns Used <input type="number" id="res-crown-used" value="8"></label>
                <label>Dream Solvent <input type="number" id="res-solvent" value="14"></label>
                <label>Dust of Azoth <input type="number" id="res-azoth" value="650"></label>
            </div>
        </section>

        <!-- PITY & BANNER TRACKER -->
        <section class="panel">
            <h2>Pity & Wish Tracker</h2>
            <div class="grid-2col">
                <label>Character Event Pity <input type="number" id="pity-char" value="45"></label>
                <label>Character 50/50 Status <select id="status-char"><option value="50/50">50/50 (Not Guaranteed)</option><option value="Guaranteed">Guaranteed</option></select></label>
                <label>Weapon Banner Pity <input type="number" id="pity-weapon" value="12"></label>
                <label>Epitomized Path Fate Points <input type="number" id="fate-points" value="0" max="1"></label>
                <label>Standard Banner Pity <input type="number" id="pity-standard" value="62"></label>
                <label>Chronicled Wish Pity <input type="number" id="pity-chronicled" value="0"></label>
            </div>
        </section>

        <!-- ENDGAME CONTENT PERFORMANCE -->
        <section class="panel">
            <h2>Endgame Performance</h2>
            <div class="grid-2col">
                <label>Spiral Abyss Progress <input type="text" id="abyss-stars" value=" Floor 12 (36/36 Stars)"></label>
                <label>Abyss Team 1 <input type="text" id="abyss-t1" value="Arlecchino, Yelan, Bennett, Kazuha"></label>
                <label>Abyss Team 2 <input type="text" id="abyss-t2" value="Alhaitham, Nahida, Yae Miko, Zhongli"></label>
                <label>Imaginarium Theater Level <select id="it-diff"><option value="Visionary">Visionary Mode</option><option value="Hard">Hard Mode</option><option value="Normal">Normal Mode</option></select></label>
                <label>Imaginarium Stars <input type="text" id="it-stars" value=" 10/10 Fantasia Flowers"></label>
                <label>Theater Element Pool <input type="text" id="it-elements" value="Pyro / Hydro / Anemo"></label>
            </div>
        </section>

        <!-- SQUAD & ARTIFACT BUILDER -->
        <section class="panel">
            <h2>Active Build Priority</h2>
            <div class="add-char-block">
                <div class="grid-3col">
                    <label>Character Name <input type="text" id="b-name" placeholder="Arlecchino"></label>
                    <label>Level / Constellation <input type="text" id="b-const" value="Lv 90 / C0"></label>
                    <label>Weapon <input type="text" id="b-weapon" value="Crimson Moon's Semblance R1"></label>
                    <label>Artifact Set <input type="text" id="b-artifact" value="4pc Fragment of Harmonic Whimsy"></label>
                    <label>Stats (CR / CD / ER / EM) <input type="text" id="b-stats" value="75.4% / 210.2% / 120% / 80"></label>
                    <label>Talent Levels <input type="text" id="b-talents" value="10 / 9 / 9"></label>
                </div>
                <button type="button" class="btn-accent" style="margin-top: 12px; width: 100%;" onclick="addBuildDetail()">+ Add Build Target</button>
            </div>
            <div id="build-list" class="roster-list-container"></div>
        </section>

        <!-- OUTPUT AREA -->
        <section class="panel" id="output-section" style="display:none;">
            <h2>Generated Tactical Report</h2>
            <textarea id="text-output" readonly></textarea>
        </section>

        <!-- BUTTONS -->
        <footer class="action-footer">
            <div class="btn-group">
                <button type="button" onclick="logSession()">Save State</button>
                <button type="button" class="btn-accent" onclick="generateReport()">Generate Prompt</button>
                <button type="button" onclick="compareSessions()">Compare Progress</button>
                <button type="button" onclick="exportJSON()">Export JSON</button>
                <button type="button" onclick="document.getElementById('importFile').click()">Import JSON</button>
                <button type="button" onclick="copyReport()">Copy Prompt</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
