<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Journey Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Genshin Journey Tracker</h1>
            <div class="io-buttons">
                <input type="file" id="importFile" accept=".json" style="display:none">
                <button onclick="document.getElementById('importFile').click()">Import JSON</button>
                <button onclick="exportData()">Export JSON</button>
            </div>
        </header>

        <main class="grid-layout">
            <!-- KIRI: Input & Status -->
            <section class="panel">
                <h2>Current Status</h2>
                <div class="input-group-row">
                    <label>AR <input type="number" id="ar" value="27"></label>
                    <label>WL <input type="number" id="wl" value="2"></label>
                </div>
                <label>Main Quest
                    <input type="text" id="quest" value="Chapter I Act III">
                </label>

                <h3>Resources</h3>
                <div class="resource-grid">
                    <label>Primo <input type="number" id="primo" value="3894"></label>
                    <label>Mora <input type="number" id="mora" value="150000"></label>
                    <label>Fragile <input type="number" id="fragile" value="5"></label>
                </div>

                <h3>Exploration</h3>
                <div class="resource-grid">
                    <label>Mondstadt <input type="text" id="exp-mondstadt" value="42%"></label>
                    <label>Liyue <input type="text" id="exp-liyue" value="17%"></label>
                </div>
            </section>

            <!-- TENGAH: Checklist & Roster -->
            <section class="panel">
                <h2>Daily Checklist</h2>
                <div class="checklist">
                    <label><input type="checkbox" id="todo-comm"> Daily Commission</label>
                    <label><input type="checkbox" id="todo-resin"> Resin</label>
                    <label><input type="checkbox" id="todo-exp"> Expedition</label>
                    <label><input type="checkbox" id="todo-bp"> Battle Pass</label>
                </div>

                <h3>Roster</h3>
                <div id="roster-list"></div>
                <div class="add-char-form">
                    <input type="text" id="new-char-name" placeholder="Char Name">
                    <button onclick="addCharacter()">Add</button>
                </div>
            </section>

            <!-- KANAN: Media & Analisis -->
            <section class="panel flex-col">
                <h2>Screenshots</h2>
                <div id="drop-zone">Drag & Drop Image Here</div>

                <h2>Actions</h2>
                <button class="btn-primary" onclick="generateAnalysisPrompt()">Analyze with Nova</button>
                <button class="btn-secondary" onclick="logSession()">Save Session</button>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
