<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Impact Decision-Driven Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-wrapper">
        <header class="header-banner">
            <div class="brand">
                <span class="badge-tag">DECISION ENGINE</span>
                <h1>TEYVAT MASTER DATABASE</h1>
            </div>
            <button type="button" id="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>
        </header>

        <!-- OBJECTIVES & CHECKPOINTS -->
        <section class="panel highlight-panel">
            <h2>Current Objective & Checkpoints</h2>
            <div class="form-grid grid-2col">
                <label>Main Goal <input type="text" id="obj-main" value="Finish Fontaine AQ & Build Tighnari"></label>
                <label>Today's Target <input type="text" id="obj-today" value="Farm Admonition Books (Sumeru)"></label>
                <label>Next Checkpoint <input type="text" id="obj-checkpoint" value="Tighnari Lv 80/80, Talents 8/6/6"></label>
                <label>Long Term Goal <input type="text" id="obj-longterm" value="Save for Mavuika + Signature Weapon"></label>
            </div>
        </section>

        <!-- WISH & PITY ENGINE -->
        <section class="panel">
            <h2>Wish & Savings Engine</h2>
            <div class="form-grid grid-3col">
                <label>Primogems <input type="number" id="w-primo" value="8400" oninput="calculatePulls()"></label>
                <label>Intertwined Fate <input type="number" id="w-if" value="12" oninput="calculatePulls()"></label>
                <label>Acquaint Fate <input type="number" id="w-af" value="5"></label>
                <label>Effective Pulls (Calculated) <input type="text" id="w-effective" readonly style="color:var(--accent); font-weight:700;"></label>
                <label>Saving For Target <input type="text" id="w-target" value="Mavuika (Pyro Archon)"></label>
                <label>Character Event Pity <input type="number" id="w-pity-char" value="55"></label>
                <label>50/50 Status <select id="w-status-char"><option value="50/50">50/50 (Not Guaranteed)</option><option value="Guaranteed">Guaranteed</option></select></label>
                <label>Last 5★ Pulled <input type="text" id="w-last5star" value="Diluc (Lost 50/50)"></label>
                <label>Weapon Banner Pity <input type="number" id="w-pity-weapon" value="10"></label>
                <label>Weapon Fate Points <input type="number" id="w-fate-points" value="0" max="1"></label>
                <label>Standard Banner Pity <input type="number" id="w-pity-standard" value="40"></label>
            </div>
        </section>

        <!-- RESOURCE INVENTORY -->
        <section class="panel">
            <h2>Core Resource Bottlenecks</h2>
            <div class="form-grid grid-4col">
                <label>Original Resin <input type="number" id="r-resin" value="160"></label>
                <label>Fragile Resin <input type="number" id="r-fragile" value="18"></label>
                <label>Mora <input type="number" id="r-mora" value="4500000"></label>
                <label>Hero's Wit <input type="number" id="r-wit" value="230"></label>
                <label>Mystic Ore <input type="number" id="r-ore" value="1400"></label>
                <label>Crowns of Insight <input type="number" id="r-crowns" value="4"></label>
                <label>Dream Solvent <input type="number" id="r-solvent" value="12"></label>
                <label>Teapot Level <input type="number" id="r-teapot" value="10"></label>
            </div>
        </section>

        <!-- CORE ROSTER & BUILD TARGETS (CRITICAL SECTION) -->
        <section class="panel">
            <h2>Roster & Target Builds</h2>
            <div class="add-char-block">
                <div class="form-grid grid-3col">
                    <label>Character Name <input type="text" id="b-name" placeholder="Tighnari"></label>
                    <label>Level Current / Max <input type="text" id="b-lvl" placeholder="80/80"></label>
                    <label>Constellation <input type="text" id="b-const" placeholder="C0"></label>
                    <label>Weapon & Refinement <input type="text" id="b-weapon" placeholder="Slingshot R5 Lv80"></label>
                    <label>Current Talents <input type="text" id="b-talents-curr" placeholder="6/6/6"></label>
                    <label>Target Talents <input type="text" id="b-talents-targ" placeholder="8/6/6"></label>
                    <label>Artifact Set & Main Stats <input type="text" id="b-art" placeholder="4pc Deepwood (EM/Dendro/Crit)"></label>
                    <label>Status / Priority <select id="b-status"><option value="Active Build">Active Build</option><option value="Ready">Ready / Done</option><option value="Benched">Benched</option></select></label>
                </div>
                <button type="button" class="btn-accent" style="margin-top: 12px; width: 100%;" onclick="addCharacter()">+ Add Character to Roster</button>
            </div>
            <div id="roster-list" class="roster-list-container"></div>
        </section>

        <!-- MAP EXPLORATION MATRIX -->
        <section class="panel">
            <h2>Exploration Matrix (Primogem Pools)</h2>
            <div class="form-grid grid-4col">
                <label>Mondstadt (%) <input type="number" id="e-mond" value="92"></label>
                <label>Dragonspine (%) <input type="number" id="e-drag" value="85"></label>
                <label>Liyue (%) <input type="number" id="e-liyue" value="30"></label>
                <label>Chenyu Vale (%) <input type="number" id="e-chenyu" value="15"></label>
                <label>Inazuma (%) <input type="number" id="e-ina" value="23"></label>
                <label>Enkanomiya (%) <input type="number" id="e-enka" value="10"></label>
                <label>The Chasm (%) <input type="number" id="e-chasm" value="40"></label>
                <label>Sumeru (%) <input type="number" id="e-sumeru" value="4"></label>
                <label>Fontaine (%) <input type="number" id="e-font" value="4"></label>
                <label>Natlan (%) <input type="number" id="e-natlan" value="0"></label>
                <label>Nod Krai (%) <input type="number" id="e-nodkrai" value="0"></label>
            </div>
        </section>

        <!-- DECISION ARTIFACTS & WEEKLY -->
        <section class="panel">
            <h2>Domain & Weekly Resin Decisions</h2>
            <div class="form-grid grid-2col">
                <label>Active Domain Target <input type="text" id="art-domain" value="Deepwood / Gilded Domain"></label>
                <label>Strongbox Target <input type="text" id="art-strongbox" value="Emblem of Severed Fate"></label>
                <label>Weekly Boss Reasoning <textarea id="w-bosses" rows="2" placeholder="Apep -> Tighnari talent&#10;Arlecchino -> Clorinde talent"></textarea></label>
                <label>Endgame Records <input type="text" id="eg-status" value="Abyss 33★ | IT Hard (12 Built Roster)"></label>
            </div>
        </section>

        <!-- OUTPUT AREA -->
        <section class="panel" id="output-section" style="display:none;">
            <h2>Generated Master Prompt</h2>
            <textarea id="text-output" readonly></textarea>
        </section>

        <!-- BUTTONS -->
        <footer class="action-footer">
            <div class="btn-group">
                <button type="button" onclick="logSession()">Save State</button>
                <button type="button" class="btn-accent" onclick="generateReport()">Generate Prompt</button>
                <button type="button" onclick="exportJSON()">Export JSON</button>
                <button type="button" onclick="document.getElementById('importFile').click()">Import JSON</button>
                <button type="button" onclick="copyReport()">Copy Prompt</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none">
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
